version: "2"

run:
  timeout: 5m

linters:
  default: none
  enable:
    - bodyclose
    - contextcheck
    - errcheck
    - errorlint
    - govet
    - ineffassign
    - misspell
    - noctx
    - staticcheck
    - unused
  exclusions:
    paths:
      - lk/internal/gen

formatters:
  enable:
    - gofmt
  exclusions:
    paths:
      - lk/internal/gen
